name: dbt Snowflake Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select action to run'
        required: true
        type: choice
        options:
          - deploy-infrastructure
          - build-and-push-image
          - run-dbt-pipeline

jobs:
  # ── Job 1: Deploy CDK Infrastructure ───────────────────────────────
  deploy_infrastructure:
    name: Deploy AWS Infrastructure (CDK)
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'deploy-infrastructure'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Node.js (required for CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install CDK dependencies
        run: uv sync
        working-directory: infrastructure

      - name: CDK Bootstrap
        run: uv run cdk bootstrap
        working-directory: infrastructure
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: CDK Deploy all stacks
        run: uv run cdk deploy --all --require-approval never
        working-directory: infrastructure
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

  # ── Job 2: Build Docker image and push to ECR ──────────────────────
  build_and_push:
    name: Build and Push Docker Image to ECR
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'build-and-push-image'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: dbt-snowflake
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:latest"

  # ── Job 3: Run dbt pipeline directly ───────────────────────────────
  dbt_pipeline:
    name: Run dbt Pipeline
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'run-dbt-pipeline'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        run: uv sync

      - name: Create dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          aws_snowflake_dbt:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                database: ANALYTICS
                schema: STAGING
                threads: 4
                client_session_keep_alive: false
          EOF

      - name: Install dbt packages
        run: uv run dbt deps
        working-directory: aws_snowflake_dbt

      - name: Run staging models
        run: uv run dbt run --select staging
        working-directory: aws_snowflake_dbt

      - name: Run snapshots
        run: uv run dbt snapshot
        working-directory: aws_snowflake_dbt

      - name: Run dimension models
        run: uv run dbt run --select marts.dimensions
        working-directory: aws_snowflake_dbt

      - name: Run fact models
        run: uv run dbt run --select marts.facts
        working-directory: aws_snowflake_dbt

      - name: Run dbt tests
        run: uv run dbt test
        working-directory: aws_snowflake_dbt
